name: kairos

x-backend-env: &backend-env
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://kairos:kairos@db:5432/kairos

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Migraciones + carga de data/seed + betas. Se ejecuta una vez en cada `up` y con `make seed`.
  # Usa la imagen del backend; los pasos que aún no existen (alembic, seed_db.py,
  # compute_betas.py) se saltan. Las betas van después del seed (necesitan la tabla `asset`):
  # sin ellas el motor de impacto no tiene incertidumbre y todos los rangos salen colapsados.
  seed:
    build: ./backend
    <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data:ro
      - ./scripts:/scripts:ro
    command:
      - sh
      - -c
      - |
        set -e
        if [ -f alembic.ini ]; then alembic upgrade head; else echo "seed: sin alembic todavía (T1-01)"; fi
        if [ -f /scripts/seed_db.py ]; then python /scripts/seed_db.py; else echo "seed: sin scripts/seed_db.py todavía (T1-03)"; fi
        if [ -f /scripts/compute_betas.py ]; then python /scripts/compute_betas.py; else echo "seed: sin scripts/compute_betas.py todavía (T1-12)"; fi
    restart: "no"

  backend:
    build: ./backend
    <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    volumes:
      - ./data:/data:ro
      - ./scripts:/scripts:ro
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 5s
      timeout: 3s
      retries: 20

  # Actualización diaria tras el cierre (T4-02): guarda los cierres de los activos en cartera, el
  # EUR/USD y los 5 factores de lunes a viernes a las 22:30 UTC, sin que nadie abra la app. En modo
  # demo (MARKET_DATA_PROVIDER=offline) termina al arrancar sin hacer nada. Un fallo de un activo
  # se registra en el log y no para el resto ni el backend.
  updater:
    build: ./backend
    <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    volumes:
      - ./data:/data:ro
      - ./scripts:/scripts:ro
    command: ["python", "/scripts/daily_update.py", "--loop", "--at", "22:30"]
    restart: on-failure

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
