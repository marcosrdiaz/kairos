[project]
name = "kairos-backend"
version = "0.1.0"
description = "KAIROS: impacto en euros de los eventos financieros sobre la cartera de un inversor particular"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: llama a APIs externas reales; no corre en CI"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# DTZ prohíbe datetime.now()/utcnow() sin zona: usa app.core.clock.now() (D-031).
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con caracteres ambiguos

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# mypy --strict en los módulos que lo exigen (CLAUDE.md) y en lo común.
[[tool.mypy.overrides]]
module = [
    "app.core.*",
    "app.schemas.*",
    "app.portfolio.*",
    "app.impact.*",
    "app.agents.guardian",
]
strict = true
